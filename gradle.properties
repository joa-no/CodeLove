# To set the application display name, only define either `app.name` or `app.name_byte_array`.
# For a rule of thumb:
# * Use `app.name` if your app name doesn't contain any non-ANSI characters.
# * Otherwise, convert `app.name_byte_array` to UTF-8 bytes, comma delimited.
app.name=CodeLove

app.application_id=com.joano.codelove
app.orientation=unspecified
app.version_code=1
app.version_name=1.0.0

# No need to modify anything past this line!
android.enableJetifier=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.dependency.useConstraints=true
