name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4G'"
    steps:
    - name: Prepare Environment
      run: sudo apt-get update && curl -Lo kitware-archive.sh https://apt.kitware.com/kitware-archive.sh && sudo bash ./kitware-archive.sh
    - name: Install Dependencies
      run: sudo apt-get install ninja-build cmake
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17
        cache: gradle
    - name: Check offline APK identity validation
      run: |
        mkdir -p "$RUNNER_TEMP/offline-identity-classes"
        javac -d "$RUNNER_TEMP/offline-identity-classes" \
          app/src/normal/java/org/love2d/android/OfflineApkIdentity.java \
          app/src/testOffline/java/org/love2d/android/OfflineApkIdentityCheck.java
        java -cp "$RUNNER_TEMP/offline-identity-classes" \
          org.love2d.android.OfflineApkIdentityCheck
    - name: Check binary manifest decoding
      run: |
        mkdir -p "$RUNNER_TEMP/offline-manifest-classes"
        javac -d "$RUNNER_TEMP/offline-manifest-classes" \
          app/src/normal/java/org/love2d/android/OfflineBinaryManifest.java \
          app/src/testOffline/java/org/love2d/android/OfflineBinaryManifestCheck.java
        java -cp "$RUNNER_TEMP/offline-manifest-classes" \
          org.love2d.android.OfflineBinaryManifestCheck
    - name: Prepare release signing
      if: ${{ matrix.build_type == 'Release' }}
      env:
        CODELOVE_KEYSTORE_BASE64: ${{ secrets.CODELOVE_KEYSTORE_BASE64 }}
      run: |
        echo "$CODELOVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codelove-release.jks"
    - name: Record corresponding source revisions
      shell: bash
      run: python3 tools/write_source_revision.py
    - name: Prepare original NDK runtime notice
      shell: bash
      run: |
        set -euo pipefail
        NDK="$ANDROID_HOME/ndk/27.3.13750724"
        if [ ! -f "$NDK/source.properties" ]; then
          sdkmanager "ndk;27.3.13750724"
        fi
        python3 tools/prepare_ndk_runtime_notice.py "$NDK"
    - name: Prepare bundled offline embed template
      shell: bash
      run: |
        set -euo pipefail
        # This placeholder is only for building the standalone embed template.
        # Never include it as a real game or in the normal workspace.
        mkdir -p app/src/embed/assets app/src/normal/assets/offline
        python3 - <<'PY'
        from zipfile import ZipFile, ZIP_DEFLATED
        with ZipFile('app/src/embed/assets/game.love', 'w', ZIP_DEFLATED) as z:
            z.writestr('main.lua', "error('CodeLove template placeholder')\n")
        PY
        # No release signing environment in this step: build an unsigned
        # embed-flavor APK for later per-game signing on the device.
        bash ./gradlew assembleEmbedNoRecordRelease \
          '-Papp.name=CodeLove Offline Template' \
          '-Papp.application_id=com.example.codelove.offlinetemplate' \
          '-Papp.version_name=1.0.0' '-Papp.version_code=1'
        TEMPLATE=app/build/outputs/apk/embedNoRecord/release/app-embed-noRecord-release-unsigned.apk
        test -s "$TEMPLATE"
        unzip -Z1 "$TEMPLATE" | grep -Fx 'assets/game.love'
        unzip -Z1 "$TEMPLATE" | grep -Fx 'lib/arm64-v8a/liblove.so'
        cp "$TEMPLATE" app/src/normal/assets/offline/embed-unsigned.apk
        # Remove the temporary embed placeholder from the source tree.
        rm app/src/embed/assets/game.love
    - name: Verify bundled template is present
      run: test -s app/src/normal/assets/offline/embed-unsigned.apk
    - name: Reject editor classes and resources in exported-game template
      run: python3 tools/check_embed_template.py app/src/normal/assets/offline/embed-unsigned.apk
    - name: Validate real bundled binary manifest
      run: |
        java -cp "$RUNNER_TEMP/offline-manifest-classes" \
          org.love2d.android.OfflineBinaryManifestCheck \
          app/src/normal/assets/offline/embed-unsigned.apk
    - name: Verify notices survive actual Java game export
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/notice-export-test"
        javac --release 17 -d "$RUNNER_TEMP/notice-export-test" \
          app/src/normal/java/org/love2d/android/OfflineGameApk.java \
          app/src/normal/java/org/love2d/android/OfflineBinaryManifest.java \
          app/src/normal/java/org/love2d/android/OfflineApkIdentity.java \
          app/src/normal/java/org/love2d/android/OfflineApkIconResources.java \
          tools/OfflineGameApkTest.java
        python3 - <<'PY'
        import os
        from pathlib import Path
        from zipfile import ZipFile
        with ZipFile(Path(os.environ["RUNNER_TEMP"]) / "notice-export-test" / "sample.love", "w") as game:
            game.writestr("main.lua", "function love.load() end")
        PY
        java -cp "$RUNNER_TEMP/notice-export-test" org.love2d.android.OfflineGameApkTest --repack-assets \
          app/src/normal/assets/offline/embed-unsigned.apk \
          "$RUNNER_TEMP/notice-export-test/sample.love" \
          "$RUNNER_TEMP/notice-export-test/sample.apk"
        python3 - <<'PY'
        import os
        from pathlib import Path
        from zipfile import ZipFile
        with ZipFile("app/src/normal/assets/offline/embed-unsigned.apk") as template:
            with ZipFile(Path(os.environ["RUNNER_TEMP"]) / "notice-export-test" / "sample.apk") as game:
                for name in ("assets/runtime-licenses.txt", "assets/native-license-notices.txt",
                             "assets/jvm-dependency-notices.txt", "assets/ndk-runtime-notice.txt", "META-INF/CODELOVE-SOURCE.txt"):
                    assert template.read(name) == game.read(name), name
                assert "assets/codelove-licenses.txt" not in game.namelist()
                assert game.read("assets/main.lua") == b"function love.load() end"
        print("Runtime notices and source revision preserved by the production Java exporter")
        PY
    - name: Build Normal Flavor
      env:
        CODELOVE_RELEASE_STORE_FILE: ${{ runner.temp }}/codelove-release.jks
        CODELOVE_RELEASE_STORE_PASSWORD: ${{ secrets.CODELOVE_KEYSTORE_PASSWORD }}
        CODELOVE_RELEASE_KEY_ALIAS: ${{ secrets.CODELOVE_KEY_ALIAS }}
        CODELOVE_RELEASE_KEY_PASSWORD: ${{ secrets.CODELOVE_KEY_PASSWORD }}
      run: bash ./gradlew assembleNormalRecord${{ matrix.build_type }}
    - name: Verify license assets in packaged CodeLove APK
      shell: bash
      run: |
        set -euo pipefail
        python3 - "${{ matrix.build_type }}" <<'PY'
        from io import BytesIO
        from pathlib import Path
        from zipfile import ZipFile
        import sys

        variant = sys.argv[1].lower()
        apk = Path(f"app/build/outputs/apk/normalRecord/{variant}/app-normal-record-{variant}.apk")
        editor = Path("app/src/normal/assets/codelove-licenses.txt").read_bytes()
        native = Path("app/src/main/assets/native-license-notices.txt").read_bytes()
        assert native.strip(), "Native notices are empty"
        ndk_notice = Path("app/src/main/assets/ndk-runtime-notice.txt").read_bytes()
        runtime = Path("app/src/embed/assets/runtime-licenses.txt").read_bytes()
        revision = Path("app/src/main/resources/META-INF/CODELOVE-SOURCE.txt").read_bytes()
        editor_jvm = Path("app/src/normal/assets/jvm-dependency-notices.txt").read_bytes()
        runtime_jvm = Path("app/src/embed/assets/jvm-dependency-notices.txt").read_bytes()
        assert editor_jvm.strip() and runtime_jvm.strip() and editor_jvm != runtime_jvm
        with ZipFile(apk) as normal:
            assert normal.read("META-INF/CODELOVE-SOURCE.txt") == revision, "Editor source revision missing"
            assert normal.read("assets/codelove-licenses.txt") == editor, "Editor license asset differs from source"
            assert normal.read("assets/native-license-notices.txt") == native, "Native notices missing or changed in editor"
            assert normal.read("assets/ndk-runtime-notice.txt") == ndk_notice, "NDK notice missing or changed in editor"
            assert normal.read("assets/jvm-dependency-notices.txt") == editor_jvm, "JVM editor notices missing or changed"
            with ZipFile(BytesIO(normal.read("assets/offline/embed-unsigned.apk"))) as embed:
                assert embed.read("META-INF/CODELOVE-SOURCE.txt") == revision, "Runtime source revision missing"
                assert embed.read("assets/runtime-licenses.txt") == runtime, "Runtime license asset differs from source"
                assert embed.read("assets/native-license-notices.txt") == native, "Native notices missing or changed in runtime"
                assert embed.read("assets/ndk-runtime-notice.txt") == ndk_notice, "NDK notice missing or changed in runtime"
                assert embed.read("assets/jvm-dependency-notices.txt") == runtime_jvm, "JVM runtime notices missing or changed"
                assert "assets/codelove-licenses.txt" not in embed.namelist(), "Editor notices leaked into runtime"
        print("Packaged editor and embedded runtime license assets verified")
        PY
    - name: Collect runtime dependency reports
      if: ${{ matrix.build_type == 'Release' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/dependency-audit"
        for configuration in normalRecordReleaseRuntimeClasspath normalNoRecordReleaseRuntimeClasspath embedRecordReleaseRuntimeClasspath embedNoRecordReleaseRuntimeClasspath; do
          bash ./gradlew :app:dependencies --configuration "$configuration" --console=plain > "$RUNNER_TEMP/dependency-audit/$configuration.txt"
          if grep -Eq ' FAILED($|[[:space:]])' "$RUNNER_TEMP/dependency-audit/$configuration.txt"; then
            cat "$RUNNER_TEMP/dependency-audit/$configuration.txt"
            exit 1
          fi
        done
    - name: Collect original dependency notices and native source revisions
      if: ${{ matrix.build_type == 'Release' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODELOVE_AUDIT_DIR="$RUNNER_TEMP/dependency-audit"
        bash ./gradlew -I tools/dependency-audit.init.gradle :app:collectAuditArtifacts --console=plain
        python3 tools/collect_dependency_notices.py "$CODELOVE_AUDIT_DIR"
        python3 tools/check_jvm_notices.py "$CODELOVE_AUDIT_DIR"
        git submodule status --recursive > "$CODELOVE_AUDIT_DIR/native-source-revisions.txt"
        python3 - <<'PY'
        import os
        from pathlib import Path
        from zipfile import ZipFile
        from io import BytesIO
        root = Path(os.environ["CODELOVE_AUDIT_DIR"])
        path = Path("app/build/outputs/apk/normalRecord/release/app-normal-record-release.apk")
        with ZipFile(path) as editor:
            with ZipFile(BytesIO(editor.read("assets/offline/embed-unsigned.apk"))) as runtime:
                for label, archive in (("editor", editor), ("runtime", runtime)):
                    libs = sorted(n for n in archive.namelist() if n.startswith("lib/") and n.endswith(".so"))
                    assert libs, label
                    (root / (label + "-native-libraries.txt")).write_text("\n".join(libs) + "\n")
        PY
    - name: Prepare candidate corresponding-source archive
      if: ${{ matrix.build_type == 'Release' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/source-candidate"
        git clone --depth 1 --branch 0.24.7 https://github.com/Rosemoe/sora-editor.git "$RUNNER_TEMP/sora-source"
        # Sora uses an SSH submodule URL; fetch public sources over HTTPS without credentials.
        git -C "$RUNNER_TEMP/sora-source" -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive
        python3 tools/package_source_candidate.py "$RUNNER_TEMP/source-candidate" "$RUNNER_TEMP/sora-source"
    - name: Verify candidate source archive can rebuild without checkout
      if: ${{ matrix.build_type == 'Release' }}
      shell: bash
      run: bash tools/rebuild_source_candidate.sh "$RUNNER_TEMP/source-candidate" "$RUNNER_TEMP/source-rebuild"
    - name: Artifact (Corresponding source candidate)
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: codelove-source-candidate
        path: ${{ runner.temp }}/source-candidate
        if-no-files-found: error
        compression-level: 0
    - name: Collect installed NDK copyright and notice candidates
      if: ${{ matrix.build_type == 'Release' }}
      shell: bash
      run: |
        set -euo pipefail
        NDK="$ANDROID_HOME/ndk/27.3.13750724"
        test -d "$NDK"
        python3 tools/collect_ndk_notices.py "$NDK" "$RUNNER_TEMP/dependency-audit"
    - name: Artifact (Dependency audit reports)
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: dependency-audit-reports
        path: ${{ runner.temp }}/dependency-audit
        if-no-files-found: error
    - name: Verify signed CodeLove release APK
      if: ${{ matrix.build_type == 'Release' }}
      shell: bash
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/normalRecord/release/app-normal-record-release.apk
        test -s "$APK"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        test -x "$APKSIGNER"
        "$APKSIGNER" verify --verbose "$APK"
    - name: Build Release-specific Binaries
      if: ${{ matrix.build_type == 'Release' }}
      env:
        CODELOVE_RELEASE_STORE_FILE: ${{ runner.temp }}/codelove-release.jks
        CODELOVE_RELEASE_STORE_PASSWORD: ${{ secrets.CODELOVE_KEYSTORE_PASSWORD }}
        CODELOVE_RELEASE_KEY_ALIAS: ${{ secrets.CODELOVE_KEY_ALIAS }}
        CODELOVE_RELEASE_KEY_PASSWORD: ${{ secrets.CODELOVE_KEY_PASSWORD }}
      run: bash ./gradlew bundleNormalNoRecordRelease bundleEmbedRecordRelease bundleEmbedNoRecordRelease
    - name: Artifact (Normal debug APK)
      if: ${{ matrix.build_type == 'Debug' }}
      uses: actions/upload-artifact@v4
      with:
        name: love-android-debug.apk
        path: app/build/outputs/apk/normalRecord/debug/app-normal-record-debug.apk
    - name: Artifact (Normal signed APK)
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: love-android.apk
        path: app/build/outputs/apk/normalRecord/release/app-normal-record-release.apk
    - name: Artifact (Normal AAB w/o recording)
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: love-android-ps.aab
        path: app/build/outputs/bundle/normalNoRecordRelease/app-normal-noRecord-release.aab
    - name: Artifact (Embed AAB)
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: love-android-embed-record.aab
        path: app/build/outputs/bundle/embedRecordRelease/app-embed-record-release.aab
    - name: Artifact (Embed AAB w/o recording)
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: love-android-embed.aab
        path: app/build/outputs/bundle/embedNoRecordRelease/app-embed-noRecord-release.aab
    - name: Artifact (Debug symbols)
      uses: actions/upload-artifact@v4
      with:
        name: love-android-unstripped-debugsyms-${{ matrix.build_type }}
        path: app/build/intermediates/cxx
